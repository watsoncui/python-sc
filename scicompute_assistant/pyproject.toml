[project]
name = "scicompute-assistant"
version = "0.1.0"
description = "SciCompute-Assistant: dual-mode (server/local) Python scientific computing teaching assistant with TDA visualization."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "SciCompute Course Team" }]
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "RestrictedPython>=7.1",
    "cryptography>=42.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
tda = [
    "giotto-tda>=0.6.0",
]
rag = [
    "chromadb>=0.5",
    "sentence-transformers>=2.7",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "httpx>=0.27",
]

[project.scripts]
scicompute-server = "scicompute_assistant.server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scicompute_assistant"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["scicompute_assistant/tests"]
