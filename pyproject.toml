[project]
name = "python-computing-science"
version = "0.1.0"
description = "Python 科学计算课程 — Jupyter Notebook 讲义与练习"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "sympy>=1.13",
    "jupyter>=1.0",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
    "pandas>=2.2",
    "pytest>=8.0",
]

[project.optional-dependencies]
advanced = [
    "jax[cpu]>=0.4",
    "chaospy>=4.3",
    "dask[array]>=2024.1",
    "numba>=0.59",
    "cython>=3.0",
]
